<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chart Noir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<style>
:root{
  --negro:#000; --sangre:#8E1426; --hueso:#F2EEE8; --humo:#7d7775;
  --font:"Archivo","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--negro:#000;--hueso:#F2EEE8;color-scheme:dark}}
:root[data-theme="dark"]{--negro:#000;--hueso:#F2EEE8}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--negro);color:var(--hueso);overflow:hidden;font-family:var(--font);-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;visibility:hidden}
#scene.dragging{cursor:grabbing}

/* Entrada */
#loader{position:fixed;inset:0;z-index:20;background:#000;display:grid;place-items:center}
#num{font-weight:900;font-stretch:125%;font-variation-settings:"wdth" 125;font-size:clamp(72px,16vw,200px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
#bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--sangre)}
#flash{position:fixed;inset:0;z-index:19;background:#fff;opacity:0;pointer-events:none}

/* Mensaje y cuenta atrás */
.info{position:fixed;left:0;right:0;bottom:calc(6vh + env(safe-area-inset-bottom,0px));z-index:6;text-align:center;padding:0 20px;pointer-events:none}
.info .line{display:block;opacity:0;transform:translateY(14px);transition:opacity .7s ease, transform .7s cubic-bezier(.2,.8,.2,1)}
.info.show .line{opacity:1;transform:none}
.info.show .l2{transition-delay:.25s}
.info.show .l3{transition-delay:.5s}
.phrase{font-weight:800;font-variation-settings:"wdth" 112;font-size:clamp(20px,2.6vw,32px);letter-spacing:.01em;margin:0}
.sub{margin:8px 0 26px;font-weight:400;font-size:clamp(14px,1.4vw,16px);color:var(--humo)}
.count{display:inline-flex;align-items:flex-start;gap:clamp(14px,3vw,40px)}
.count span{display:flex;flex-direction:column;align-items:center}
.count b{font-weight:900;font-variation-settings:"wdth" 125;font-size:clamp(34px,5.6vw,72px);line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.count .sep{color:var(--sangre);font-weight:900;font-variation-settings:"wdth" 125;font-size:clamp(34px,5.6vw,72px);line-height:1}
.count small{margin-top:10px;font-size:12px;letter-spacing:.04em;color:var(--humo)}
.hint{position:fixed;top:calc(22px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;z-index:6;font-size:13px;color:var(--humo);opacity:0;transition:opacity 1s;pointer-events:none}
.hint.show{opacity:1}
@media (max-width:600px){.count{gap:8px}.count small{font-size:11px}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Logo de Chart Noir en 3D. Arrastra para girarlo."></canvas>
<div id="flash"></div>
<div id="loader" role="status" aria-live="polite"><div id="num">0</div><div id="bar"></div></div>
<div class="hint" id="hint">Arrastra el logo para girarlo</div>

<section class="info" id="info" aria-label="Próximo drop">
  <p class="phrase line l1">Se acerca algo serio.</p>
  <p class="sub line l2">El primer drop está en camino. No avisaremos dos veces.</p>
  <div class="count line l3">
    <span><b id="d">00</b><small>días</small></span><b class="sep">:</b>
    <span><b id="h">00</b><small>horas</small></span><b class="sep">:</b>
    <span><b id="m">00</b><small>min</small></span><b class="sep">:</b>
    <span><b id="s">00</b><small>seg</small></span>
  </div>
</section>

});
const envMap = pmrem.fromScene(envScene, .02).texture;

/* ===== Logo 3D ===== */
const logo = new THREE.Group(); scene.add(logo);
const matFace = new THREE.MeshStandardMaterial({color:0xF2EEE8, emissive:0x4a4744, roughness:.28, metalness:.2, envMap, envMapIntensity:.7});
const matMonoSide = new THREE.MeshStandardMaterial({color:0x8a8580, roughness:.35, metalness:.5, envMap, envMapIntensity:.6});

  s.h.forEach(h => sh.holes.push(new THREE.Path(h.map(p => new THREE.Vector2(p[0], p[1])))));
  const isText = s.t === 1, depth = isText ? .7 : .75;
  const geo = new THREE.ExtrudeGeometry(sh, {depth, bevelEnabled:true, bevelThickness:.04, bevelSize:.02, bevelSegments:2, curveSegments:1});
  geo.translate(0, 0, -depth/2);
  logo.add(new THREE.Mesh(geo, [matFace, isText ? matTextSide : matMonoSide]));
});

/* Luces limpias, blancas */
scene.add(new THREE.AmbientLight(0xffffff, .55));
const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(0, 3, 10); scene.add(key);
const side = new THREE.DirectionalLight(0xffffff, .5); side.position.set(-8, 4, 2); scene.add(side);
const cursorLight = new THREE.PointLight(0xffffff, 1.4, 20, 2); cursorLight.position.set(0, 0, 5); scene.add(cursorLight);

/* ===== Encuadre ===== */
let dist = 30;
function fit(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  const vf = THREE.MathUtils.degToRad(camera.fov), hf = 2*Math.atan(Math.tan(vf/2)*camera.aspect);
  dist = Math.max(6.2/Math.tan(hf/2), 7.6/Math.tan(vf/2));
  const visH = 2*dist*Math.tan(vf/2);
  logo.userData.baseY = visH * (w < 600 ? .13 : .12);
  camera.updateProjectionMatrix();
}
addEventListener("resize", fit); fit();

/* ===== Interacción ===== */
let rotY = 0, rotX = 0, velY = 0, velX = 0, dragging = false, lastX = 0, lastY = 0, px = 0, py = 0, interactive = false;
canvas.addEventListener("pointerdown", e => {
  if(!interactive) return;
  dragging = true; lastX = e.clientX; lastY = e.clientY; velX = velY = 0;
  canvas.setPointerCapture(e.pointerId); canvas.classList.add("dragging");
  document.getElementById("hint").classList.remove("show");
});
addEventListener("pointermove", e => {
  px = (e.clientX/innerWidth)*2-1; py = -(e.clientY/innerHeight)*2+1;
  if(!dragging) return;
  const dx = e.clientX-lastX, dy = e.clientY-lastY; lastX = e.clientX; lastY = e.clientY;
  velY = dx*.008; velX = dy*.004;
  rotY += velY; rotX = THREE.MathUtils.clamp(rotX+velX, -.55, .55);
});
const endDrag = () => { dragging = false; canvas.classList.remove("dragging"); };
addEventListener("pointerup", endDrag); addEventListener("pointercancel", endDrag);
addEventListener("keydown", e => { if(!interactive) return; if(e.key==="ArrowLeft") velY -= .07; if(e.key==="ArrowRight") velY += .07; });

/* ===== Animación ===== */
let hitAt = -1;
function animate(now){
  requestAnimationFrame(animate);
  const t = now/1000;
  let k = 1, shake = 0;
  if(hitAt >= 0 && !reduce){
    const ms = now - hitAt;
    k = easeOutExpo(Math.min(1, ms/900));
    shake = ms < 380 ? (1 - ms/380) * .25 : 0;
  }
  if(!dragging){
    rotY += velY; rotX += velX; velY *= .94; velX *= .88;
    if(Math.abs(velY) < .0015){ const target = Math.round(rotY/(Math.PI*2))*Math.PI*2; rotY += (target-rotY)*.03; }
    rotX += (py*-.1 - rotX)*.05;
  }
  logo.rotation.y = rotY + (dragging ? 0 : px*.2) + (reduce ? 0 : Math.sin(t*.5)*.05) + (1-k)*-.7;
  logo.rotation.x = rotX + (1-k)*.25;
  logo.scale.setScalar(1 + (1-k)*.45);
  logo.position.y = (logo.userData.baseY || 1) + (reduce ? 0 : Math.sin(t*.9)*.06);

  camera.position.set((Math.random()-.5)*shake, (Math.random()-.5)*shake, dist);
  camera.lookAt(0, 0, 0);
  cursorLight.position.x += (px*7 - cursorLight.position.x)*.1;
  cursorLight.position.y += (py*4 + 1 - cursorLight.position.y)*.1;
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

/* ===== Entrada: cuenta 0-100, corte, golpe ===== */
const loader = document.getElementById("loader"), num = document.getElementById("num"), bar = document.getElementById("bar");
const LOAD = reduce ? 300 : 2600, t0 = performance.now();
function step(now){
  const r = Math.min(1, (now-t0)/LOAD);
  const p = r < .55 ? easeOut(r/.55)*.6 : r < .8 ? .6+(r-.55)/.25*.12 : .72+easeOut((r-.8)/.2)*.28;
  num.textContent = Math.floor(p*100); bar.style.width = (p*100)+"%";
  if(r < 1) return requestAnimationFrame(step);
  num.style.visibility = "hidden"; bar.style.visibility = "hidden";       // corte seco a negro
  setTimeout(() => {
    loader.style.display = "none";
    canvas.style.visibility = "visible";
    hitAt = performance.now();
    if(!reduce) document.getElementById("flash").animate([{opacity:.9},{opacity:0}], {duration:260, easing:"ease-out"});
    setTimeout(() => {
      interactive = true;
      document.getElementById("info").classList.add("show");
      const hint = document.getElementById("hint"); hint.classList.add("show");
      setTimeout(() => hint.classList.remove("show"), 4500);
    }, reduce ? 0 : 700);
  }, reduce ? 0 : 320);
}
requestAnimationFrame(step);

/* ===== Cuenta atrás ===== */
const pad = n => String(n).padStart(2,"0");
function tick(){
  let diff = Math.max(0, DROP_DATE - new Date());
  const d = Math.floor(diff/864e5); diff -= d*864e5;
  const h = Math.floor(diff/36e5); diff -= h*36e5;
  const m = Math.floor(diff/6e4); diff -= m*6e4;
  const s = Math.floor(diff/1e3);
  [["d",d],["h",h],["m",m],["s",s]].forEach(([id,v]) => document.getElementById(id).textContent = pad(v));
}
tick(); setInterval(tick, 1000);
</script>
